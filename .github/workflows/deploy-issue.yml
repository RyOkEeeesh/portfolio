name: Deploy via Issue Label

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-deploy-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: |
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'status:published')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write
      issues: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: '${{ github.event.issue.title }}'
      ISSUE_BODY: '${{ github.event.issue.body }}'
      ISSUE_URL: '${{ github.event.issue.html_url }}'
      ISSUE_CREATED_AT: '${{ github.event.issue.created_at }}'
      ISSUE_UPDATED_AT: '${{ github.event.issue.updated_at }}'
      ISSUE_LABELS: '${{ toJSON(github.event.issue.labels) }}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Run validation
        run: pnpm run validate

      - name: Revert status labels to draft on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });

            const currentLabels = issue.data.labels
              .map(label => typeof label === 'string' ? label : label.name);

            const otherStatusLabels = currentLabels.filter(
              name => name.startsWith('status:') && name !== 'status:draft'
            );

            const hasDraft = currentLabels.includes('status:draft');

            if (otherStatusLabels.length > 0 || !hasDraft) {
              const updatedLabels = [
                ...currentLabels.filter(name => !name.startsWith('status:')),
                'status:draft'
              ];

              await github.rest.issues.setLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: updatedLabels,
              });
            }

  call-deploy:
    needs: validate
    if: needs.validate.result == 'success'
    uses: ./.github/workflows/_reusable-deploy.yml
    secrets: inherit